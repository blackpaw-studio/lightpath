<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lightpath — tunnel dev</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; }
      .stage { position: fixed; inset: 0; }
      .stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
      #labels, #fade { pointer-events: none; }
      canvas#scene { display: block; }
      .controls {
        position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 14px;
        background: rgba(11, 16, 32, 0.6); border: 1px solid rgba(140, 220, 255, 0.14);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        font: 500 12px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #cfeaff;
        max-width: calc(100vw - 32px); box-sizing: border-box;
      }
      .controls button {
        font: inherit; color: inherit; cursor: pointer; padding: 9px 14px; border-radius: 9px;
        background: rgba(34, 230, 255, 0.08); border: 1px solid rgba(34, 230, 255, 0.35);
      }
      .controls button:hover { background: rgba(34, 230, 255, 0.18); }
      .controls select { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(140, 220, 255, 0.2); border-radius: 9px; padding: 8px; }
      .controls .mode { min-width: 7ch; opacity: 0.7; text-align: center; }
      .controls[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <canvas id="fade"></canvas>
    </div>
    <div class="controls" id="controls">
      <button id="dive" type="button">Dive</button>
      <button id="surface" type="button">Surface</button>
      <select id="focus" aria-label="Focus hop"><option value="">Focus…</option></select>
      <span class="mode" id="mode">globe</span>
    </div>
    <script type="module" src="./tunnel.ts"></script>
  </body>
</html>
