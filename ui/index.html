<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Lightpath: watch the real route from your machine to any host, hop by hop, on a 3D globe." />
    <meta name="color-scheme" content="dark" />
    <title>Lightpath</title>
    <style>
      html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; }
      .stage { position: fixed; inset: 0; }
      .stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
      #labels, #fade { pointer-events: none; }
      canvas#scene { display: block; }
      /* No WebGL scene: the hop list still works, but there is nothing to dive into. */
      body.no-scene .stage, body.no-scene .hud button.view { display: none !important; }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <canvas id="fade"></canvas>
    </div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
